name: nexus_mobile
description: "NEXUS — AI-Powered Personal Command Center for Android and iOS"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & Dependency Injection
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Local SQLite Database (Offline-First)
  drift: ^2.18.0
  drift_flutter: ^0.1.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Networking & Serialization
  http: ^1.2.1
  dio: ^5.4.3+1
  json_annotation: ^4.9.0

  # Modern UI & Haptics
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0

  # System & Notifications
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.9
  json_serializable: ^6.8.0
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
